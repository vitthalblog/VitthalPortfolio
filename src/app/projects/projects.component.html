<section id="projects" class="section-padding projects-section"><div class="container">
  <div class="section-title"><span>WHAT I HAVE WORKED ON</span><h2>MY PROJECTS</h2><div></div><p>Selected business portals and web applications.</p></div>
  <div class="row g-4"><div class="col-md-6 col-lg-4" *ngFor="let project of projects"><article class="project-card h-100">
    <div class="project-icon"><i class="bi bi-window-stack"></i><span>WEB PROJECT</span></div><h3>{{project.name}}</h3><p>{{project.description}}</p>
    <a [href]="project.url" target="_blank" rel="noopener">Visit Website <i class="bi bi-arrow-up-right"></i></a>
  </article></div></div>
</div></section>
